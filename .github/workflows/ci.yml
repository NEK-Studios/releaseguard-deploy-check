name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the tool and its tests have no dependencies.
      - run: node --test
      - name: The action runs on its own example
        id: releaseguard
        uses: ./
        with:
          manifest: examples/healthy.json
      - run: test "${{ steps.releaseguard.outputs.status }}" = "review"
